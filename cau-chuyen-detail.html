<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Câu Chuyện Lịch Sử - Sử Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root {
  --main:#8B0000;
  --gold:#f4c542;
  --cream:#fff8e7;
  --dark:#2c1b12;
}

/* HERO ẢNH LỚN */
.detail-hero {
  width: 100%;
  height: 750px;
  position: relative;
  overflow: hidden;
}

.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 25%;  /* ưu tiên phần trên ảnh */
  filter: brightness(1.05) contrast(1.1) saturate(1.15);  /* sáng, sắc hơn */
  transition: transform 0.8s ease;
}

.detail-hero:hover img {
  transform: scale(1.03);   /* hiệu ứng zoom nhẹ khi hover */
}

.detail-hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0.1) 40%,
    rgba(44,27,18,0.75) 80%,
    rgba(44,27,18,0.92) 100%
  );
  display: flex;
  align-items: flex-end;
  padding: 50px 100px;
}

.detail-hero-text .era-badge {
  display: inline-block;
  background: var(--gold);
  color: var(--dark);
  padding: 6px 18px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
}

.detail-hero-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  color: white;
  line-height: 1.3;
  margin-bottom: 12px;
  max-width: 800px;
}

.detail-hero-text .meta {
  display: flex;
  gap: 20px;
  color: rgba(255,255,255,0.75);
  font-size: 14px;
}

/* NỘI DUNG */
.detail-content {
  max-width: 820px;
  margin: 0 auto;
  padding: 60px 20px 100px;
}

/* ĐOẠN MỞ ĐẦU */
.lead-text {
  font-size: 20px;
  color: var(--dark);
  line-height: 1.9;
  font-weight: 500;
  border-left: 4px solid var(--main);
  padding-left: 20px;
  margin-bottom: 40px;
}

/* ĐOẠN VĂN */
.story-paragraph {
  font-size: 17px;
  color: #333;
  line-height: 2;
  margin-bottom: 28px;
  opacity: 1;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.story-paragraph.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ẢNH GIỮA BÀI */
.story-img-mid {
  width: 100%;
  border-radius: 16px;
  margin: 36px 0;
  height: auto;
  object-fit: contain;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.story-img-mid.visible {
  opacity: 1;
  transform: translateY(0);
}

/* QUOTE NỔI BẬT */
.story-quote {
  background: #fff3cd;
  border-left: 5px solid var(--gold);
  padding: 24px 64px 24px 30px;
  border-radius: 0 12px 12px 0;
  margin: 36px 0;
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--dark);
  font-style: italic;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  position: relative;
}

.story-quote.visible {
  opacity: 1;
  transform: translateY(0);
}

.story-quote cite {
  display: block;
  margin-top: 10px;
  font-size: 14px;
  color: #b85c00;
  font-style: normal;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
}
/* HỘP BẠN CÓ BIẾT */
.fun-fact-box {
  background: #f0e6d2;
  border: 1.5px dashed #b85c00;
  border-radius: 12px;
  padding: 18px 22px;
  margin: 32px 0;
  font-size: 15px;
  color: #4a3420;
  line-height: 1.8;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.fun-fact-box.visible { opacity: 1; transform: translateY(0); }
.fun-fact-label {
  font-size: 13px;
  font-weight: 700;
  color: #b85c00;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

/* HỘP CÂU HỎI ĐỐ GIỮA BÀI */
.mini-quiz-box {
  background: #fff8e7;
  border: 2px solid #f4c542;
  border-radius: 14px;
  padding: 22px 26px;
  margin: 36px 0;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.mini-quiz-box.visible { opacity: 1; transform: translateY(0); }
.mini-quiz-label {
  font-size: 13px;
  font-weight: 700;
  color: #8B0000;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
.mini-quiz-question {
  font-size: 17px;
  font-weight: 600;
  color: #2c1b12;
  margin-bottom: 14px;
}
.mini-quiz-options { display: flex; flex-direction: column; gap: 8px; }
.mini-quiz-opt {
  background: white;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 15px;
  font-family: 'Poppins', sans-serif;
  cursor: pointer;
  text-align: left;
  transition: 0.2s;
}
.mini-quiz-opt:hover:not(:disabled) { border-color: var(--main); background: #fff3d6; }
.mini-quiz-opt:disabled { cursor: default; }
.mini-quiz-result { margin-top: 12px; font-size: 14px; display: none; font-weight: 600; }
/* NÚT SAO CHÉP TRÍCH DẪN */
.quote-copy-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: white;
  border: 1.5px solid var(--gold);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
  font-style: normal;
}
.quote-copy-btn:hover { background: var(--gold); transform: scale(1.05); }
.quote-copy-btn.copied { background: #28a745; border-color: #28a745; color: white; }
/* CHÚ THÍCH THUẬT NGỮ */
.glossary-term {
  border-bottom: 1.5px dotted var(--main);
  cursor: help;
  position: relative;
}
.glossary-tooltip {
  visibility: hidden;
  opacity: 0;
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  color: white;
  text-align: left;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  width: 260px;
  max-width: 70vw;
  z-index: 50;
  transition: opacity 0.2s;
  font-family: 'Poppins', sans-serif;
  font-style: normal;
  font-weight: 400;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  pointer-events: none;
}
.glossary-term:hover .glossary-tooltip {
  visibility: visible;
  opacity: 1;
}
.story-highlight {
  background: linear-gradient(135deg, #fff8e7, #fdf0d0);
  border-left: 4px solid var(--gold);
  padding: 18px 22px;
  margin: 28px 0;
  border-radius: 0 10px 10px 0;
  font-size: 17px;
  font-weight: 600;
  color: var(--dark);
  line-height: 1.7;
}
.tactical-note-box {
  background: #f0f4f8;
  border: 1.5px solid #4a6fa5;
  border-radius: 12px;
  padding: 18px 22px;
  margin: 32px 0;
}
.tactical-note-title {
  font-size: 14px;
  font-weight: 700;
  color: #2c4a6e;
  margin-bottom: 8px;
}
.tactical-note-content {
  font-size: 15px;
  color: #333;
  line-height: 1.8;
}
.references-box {
  max-width: 820px;
  margin: 50px auto;
  padding: 24px 28px;
  background: #fff8e7;
  border: 1px solid #f4c54260;
  border-radius: 16px;
}
.references-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  color: var(--main);
  margin-bottom: 18px;
}
.ref-item {
  display: block;
  padding: 14px 16px;
  margin-bottom: 10px;
  background: white;
  border: 1px solid #e8dcc0;
  border-radius: 10px;
  text-decoration: none;
  transition: 0.2s;
}
.ref-item:hover {
  border-color: var(--gold);
  transform: translateX(4px);
}
.ref-item strong {
  color: var(--dark);
  font-size: 15px;
}
.ref-item .ref-title {
  color: #444;
  font-size: 14px;
  margin: 4px 0;
}
.ref-item .ref-note {
  color: #888;
  font-size: 13px;
  font-style: italic;
}
/* TIÊU ĐỀ PHẦN */
.story-section-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: var(--main);
  margin: 48px 0 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid #f4c54240;
}

/* KẾT THÚC */
.story-end {
  text-align: center;
  padding: 50px 20px;
  background: linear-gradient(rgba(255,248,231,0), rgba(255,248,231,1));
}

.story-end h3 {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  color: var(--dark);
  margin-bottom: 16px;
}

.story-end p {
  color: #666;
  margin-bottom: 30px;
  font-size: 16px;
}

.btn-back {
  padding: 14px 32px;
  background: var(--main);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: 0.3s;
  margin: 0 8px;
}

.btn-back:hover {
  background: var(--gold);
  color: black;
}

.btn-next {
  padding: 14px 32px;
  background: white;
  color: var(--main);
  border: 2px solid var(--main);
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: 0.3s;
  margin: 0 8px;
}

.btn-next:hover {
  background: var(--main);
  color: white;
}
.btn-roleplay {
  padding: 14px 32px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: 0.3s;
  color: white;
}
.btn-roleplay:hover {
  transform: translateY(-2px);
  filter: brightness(0.9);
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}
/* PROGRESS BAR */
.reading-progress {
  position: fixed;
  top: 80px;
  left: 0;
  height: 3px;
  background: var(--main);
  z-index: 999;
  transition: width 0.1s;
}

/* RESPONSIVE */
/* INTERACTIVE GAME SECTION */
.game-section { margin-top: 60px; border-top: 2px solid #f4c54240; padding-top: 48px; }
.game-section-label { font-size: 13px; color: #b85c00; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; font-family: 'Poppins', sans-serif; font-weight: 600; }
.game-section h2 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--main); margin-bottom: 24px; }
.game-scene { display: none; animation: fadeIn 0.6s ease; }
.game-scene.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.game-text { font-size: 17px; color: #333; line-height: 2; margin-bottom: 16px; }
.game-dialogue { background: #fff8e7; border-left: 4px solid #f4c542; border-radius: 0 10px 10px 0; padding: 14px 20px; margin: 16px 0; font-style: italic; color: var(--dark); font-size: 17px; }
.game-choices { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
.game-choice { background: white; border: 1.5px solid #ddd; border-radius: 10px; padding: 14px 20px; font-size: 16px; font-family: 'Poppins', sans-serif; cursor: pointer; text-align: left; transition: 0.25s; display: flex; gap: 12px; align-items: flex-start; }
.game-choice:hover { border-color: var(--main); background: #fff8e7; transform: translateX(4px); }
.game-choice-letter { width: 26px; height: 26px; min-width: 26px; border-radius: 50%; background: #8B000015; border: 1px solid var(--main); color: var(--main); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.game-outcome { padding: 18px 22px; border-radius: 12px; margin: 16px 0; font-size: 16px; line-height: 1.8; }
.game-outcome.bad { background: #fff0f0; border: 1px solid #ffcccc; }
.game-outcome.good { background: #f0fff4; border: 1px solid #b2dfdb; }
.game-continue { margin-top: 24px; padding: 13px 28px; background: var(--main); color: white; border: none; border-radius: 10px; font-size: 16px; font-family: 'Poppins', sans-serif; cursor: pointer; transition: 0.3s; }
.game-continue:hover { background: #6b0000; }
.game-result {
  text-align: center;
  padding: 40px 28px;
  background: linear-gradient(135deg, #fff8e7 0%, #fdf0d0 100%);
  border-radius: 20px;
  border: 2px solid var(--gold);
  box-shadow: 0 8px 30px rgba(139,0,0,0.12);
  position: relative;
  overflow: hidden;
}
.game-result::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(244,197,66,0.15) 0%, transparent 60%);
  pointer-events: none;
}
.game-result h3 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: var(--main);
  margin-bottom: 14px;
  position: relative;
}
.game-result p {
  color: #5a4632;
  font-size: 15px;
  line-height: 1.7;
  max-width: 480px;
  margin: 0 auto 20px;
  position: relative;
}
#final-badge {
  display: inline-block;
  font-size: 20px;
  font-weight: 700;
  color: var(--dark);
  background: white;
  padding: 10px 24px;
  border-radius: 30px;
  border: 1.5px solid var(--gold);
  margin: 8px 0 6px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.06);
}
#final-points {
  font-size: 22px;
  font-weight: 800;
  color: var(--main);
  margin-bottom: 24px;
  position: relative;
}
.game-restart { margin-top: 16px; padding: 12px 28px; background: transparent; border: 1.5px solid var(--main); color: var(--main); border-radius: 10px; font-size: 15px; font-family: 'Poppins', sans-serif; cursor: pointer; transition: 0.3s; }
.game-restart:hover { background: var(--main); color: white; }
.game-restart:first-child {
  background: var(--main);
  color: white;
  border-color: var(--main);
}
.game-restart:first-child:hover {
  background: #6b0000;
  transform: translateY(-2px);
}
/* BẢNG XẾP HẠNG MODAL */
.lb-modal { display:none; position:fixed; inset:0; background:rgba(20,10,5,0.6); z-index:9997; align-items:center; justify-content:center; }
.lb-modal.show { display:flex; }
.lb-box { background:white; border-radius:16px; width:90%; max-width:420px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.lb-header { background:var(--main); color:white; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
.lb-header h3 { font-family:'Playfair Display',serif; font-size:20px; }
.lb-close { cursor:pointer; font-size:18px; opacity:0.8; }
.lb-close:hover { opacity:1; }
.lb-content { padding:16px 20px; overflow-y:auto; }
.lb-loading, .lb-empty { text-align:center; color:#999; padding:24px 0; font-size:14px; }
.lb-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #f0e8d8; }
.lb-rank { width:28px; text-align:center; font-weight:700; color:var(--main); }
.lb-name { flex:1; font-weight:600; color:var(--dark); font-size:14px; }
.lb-exp { font-size:13px; color:#b85c00; font-weight:600; }
.lb-myrank { margin-top:14px; padding:12px; background:#fff8e7; border:1px solid var(--gold); border-radius:10px; text-align:center; font-size:14px; color:var(--dark); }
@media(max-width: 768px) {
  .detail-hero { height: 350px; }
  .detail-hero-overlay { padding: 30px 20px; }
  .detail-hero-text h1 { font-size: 28px; }
  .detail-content { padding: 40px 16px 80px; }
  .lead-text { font-size: 17px; }
  .story-paragraph { font-size: 15px; }
}
/* VIDEO SECTION FOR DETAIL PAGE */
.story-video-section {
  max-width: 820px;
  margin: 60px auto 40px;
  padding: 0 20px;
  animation: fadeInUp 0.8s ease-out;
}

.story-video-label {
  font-size: 13px;
  color: #b85c00;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  font-family: 'Poppins', sans-serif;
}

.story-video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #1a1a2e;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(139, 0, 0, 0.2);
  border: 1px solid rgba(139, 0, 0, 0.3);
}

.story-video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.story-video-source {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding: 14px 18px;
  background: #fff8e7;
  border: 1px solid #f4c54260;
  border-radius: 12px;
}
.story-video-source-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: #4a3420;
}
.story-video-source-icon {
  width: 22px; height: 22px;
  background: #FF0000;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.story-video-source-icon svg { width: 12px; height: 12px; fill: white; }
.story-video-source-link {
  font-size: 13px;
  font-weight: 600;
  color: #8B0000;
  text-decoration: none;
  white-space: nowrap;
  padding: 6px 14px;
  border: 1.5px solid #8B0000;
  border-radius: 20px;
  transition: 0.2s;
}
.story-video-source-link:hover { background: #8B0000; color: white; }
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media(max-width:768px){
  #tts-fab{ bottom:16px; right:16px; width:52px; height:52px; font-size:20px; }
}
.accuracy-note {
  display: flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  margin-top: 10px;
  margin-bottom: 0;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(244, 197, 66, 0.5);
  border-radius: 30px;
  color: #f4c542;
  font-size: 13px;
  backdrop-filter: blur(4px);
}
</style>

// ══ ĐỌC TRUYỆN (Backend TTS - Edge Neural Voice, đọc theo đoạn) ══
let isReading = false;
let ttsQueue = [];
let ttsIndex = 0;
let currentAudio = null;
let nextAudioBlob = null; // đoạn kế tiếp tải sẵn ngầm

function getStoryTextParts() {
  const nodes = document.querySelectorAll('.detail-content .lead-text, .detail-content .story-paragraph');
  return Array.from(nodes).map(el => el.textContent.trim()).filter(Boolean);
}

async function fetchTTSBlob(text) {
  const response = await fetch('http://localhost:3000/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (!response.ok) throw new Error('TTS lỗi');
  return await response.blob();
}

async function toggleReadAloud() {
  const fab = document.getElementById('tts-fab');
  if (isReading) {
    stopReadAloud();
    return;
  }
  ttsQueue = getStoryTextParts();
  ttsIndex = 0;
  nextAudioBlob = null;
  if (ttsQueue.length === 0) return;

  isReading = true;
  fab.textContent = '⏳';
  fab.style.background = '#999';

  try {
    // Tải đoạn đầu tiên trước, phát ngay khi có
    const firstBlob = await fetchTTSBlob(ttsQueue[0]);
    if (!isReading) return;
    playChunk(firstBlob);
  } catch (err) {
    alert('Không đọc được truyện. Kiểm tra backend (localhost:3000) đã chạy chưa.');
    stopReadAloud();
  }
}

function playChunk(blob) {
  const fab = document.getElementById('tts-fab');
  const url = URL.createObjectURL(blob);
  currentAudio = new Audio(url);

  // Trong lúc đoạn này đang đọc, tải sẵn đoạn kế tiếp ngầm phía sau
  const nextIndex = ttsIndex + 1;
  if (nextIndex < ttsQueue.length) {
    fetchTTSBlob(ttsQueue[nextIndex])
      .then(blob => { nextAudioBlob = blob; })
      .catch(() => { nextAudioBlob = null; });
  }

  currentAudio.onended = () => {
    ttsIndex++;
    if (ttsIndex < ttsQueue.length && isReading) {
      if (nextAudioBlob) {
        const b = nextAudioBlob;
        nextAudioBlob = null;
        playChunk(b);
      } else {
        // Phòng khi tải chưa xong kịp, chờ tải xong rồi phát
        fetchTTSBlob(ttsQueue[ttsIndex]).then(b => { if (isReading) playChunk(b); });
      }
    } else {
      stopReadAloud();
    }
  };

  fab.textContent = '⏸';
  fab.style.background = '#f4c542';
  currentAudio.play();
}
function applyGlossary() {
  const terms = Object.keys(glossary).sort((a, b) => b.length - a.length);
  document.querySelectorAll('.story-paragraph, .lead-text').forEach(el => {
    let html = el.innerHTML;
    terms.forEach(term => {
      if (html.indexOf(term) === -1) return;
      html = html.replace(term, `<span class="glossary-term">${term}<span class="glossary-tooltip">${glossary[term]}</span></span>`);
    });
    el.innerHTML = html;
  });
}
function stopReadAloud() {
  isReading = false;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  nextAudioBlob = null;
  const fab = document.getElementById('tts-fab');
  if (fab) {
    fab.textContent = '🔊';
    fab.style.background = '#8B0000';
  }
}
// ══ KẾT NỐI BACKEND ══
const API = 'http://localhost:3000/api';

// Cộng điểm EXP khi hoàn thành game
async function awardExp(amount, storyTitle) {
  const token = localStorage.getItem('token');
  if (!token || !amount) return; // chưa đăng nhập thì bỏ qua, không chặn game
  try {
    await fetch(`${API}/exp/add`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ amount: amount, source_type: 'GAME', note: storyTitle || '' })
    });
  } catch (err) {
    console.warn('Không thể cộng EXP:', err.message);
  }
}

// Mở bảng xếp hạng
async function openLeaderboard() {
  let modal = document.getElementById('leaderboard-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'leaderboard-modal';
    modal.className = 'lb-modal';
    modal.innerHTML = `
      <div class="lb-box">
        <div class="lb-header">
          <h3>🏆 Bảng Xếp Hạng</h3>
          <span class="lb-close" onclick="document.getElementById('leaderboard-modal').classList.remove('show')">✕</span>
        </div>
        <div id="lb-content" class="lb-content"><div class="lb-loading">Đang tải...</div></div>
      </div>`;
    document.body.appendChild(modal);
  }
  modal.classList.add('show');
  const content = document.getElementById('lb-content');
  content.innerHTML = '<div class="lb-loading">Đang tải...</div>';

  try {
    const token = localStorage.getItem('token');
    const res = await fetch(`${API}/leaderboard`, {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Lỗi tải bảng xếp hạng');

    const rows = data.data || [];
    let html = '<div class="lb-list">';
    if (rows.length === 0) {
      html += '<div class="lb-empty">Chưa có dữ liệu xếp hạng.</div>';
    } else {
      rows.forEach((r, i) => {
        const name = r.fullname || r.username || r.name || 'Ẩn danh';
        const exp = r.exp ?? r.points ?? 0;
        const level = r.level ?? '';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
        html += `<div class="lb-row">
          <div class="lb-rank">${medal}</div>
          <div class="lb-name">${name}</div>
          <div class="lb-exp">${exp} EXP${level ? ' · Lv.' + level : ''}</div>
        </div>`;
      });
    }
    html += '</div>';

    if (data.myRank) {
      const m = data.myRank;
      html += `<div class="lb-myrank">
        <strong>Hạng của bạn:</strong> #${m.rank_pos ?? '-'} — ${m.exp ?? m.points ?? 0} EXP
      </div>`;
    }
    content.innerHTML = html;
  } catch (err) {
    content.innerHTML = `<div class="lb-empty">Không tải được bảng xếp hạng. (${err.message})</div>`;
  }
}

// SCROLL ANIMATION
function initScrollAnimations() {
  const els = document.querySelectorAll('.story-paragraph, .story-img-mid, .story-quote, .fun-fact-box, .mini-quiz-box');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.15 });
  els.forEach(el => observer.observe(el));
}

// READING PROGRESS BAR
window.addEventListener('scroll', () => {
  const total = document.body.scrollHeight - window.innerHeight;
  const pct = total > 0 ? (window.scrollY / total) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
});

let gamePoints = 0;
let gameBadge = '';

function buildGame(g) {
  gamePoints = 0; gameBadge = '';
  let html = `<div class="game-section"><div class="game-section-label">⚔️ Thử thách nhập vai</div><h2>${g.title}</h2>
  <p style="font-size:13px;color:#8a7561;font-style:italic;background:#fff8e7;border-left:3px solid #f4c542;padding:10px 16px;border-radius:0 8px 8px 0;margin-bottom:20px;">
    📌 Phần trò chơi nhập vai dưới đây mang tính hư cấu minh họa, được xây dựng dựa trên bối cảnh và diễn biến lịch sử đã trình bày ở phần trên. Các lựa chọn, lời thoại là sáng tạo nhằm giúp người đọc hình dung sinh động hơn, không phải trích dẫn sử liệu gốc.
  </p>`;
  html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
    <div style="font-size:14px;color:#666;">Điểm:</div>
    <div id="game-score-display" style="font-size:20px;font-weight:700;color:#8B0000;">0</div>
    <div id="game-badge-display" style="font-size:13px;padding:4px 12px;background:#fff8e7;border:1px solid #f4c542;border-radius:20px;color:#b85c00;"></div>
  </div>`;

  g.scenes.forEach(sc => {
    html += `<div class="game-scene ${sc.id==='s1'?'active':''}" id="gs-${sc.id}">`;

    // QUIZ
    if (sc.quiz) {
      html += `<div style="background:#fff8e7;border:2px solid #f4c542;border-radius:12px;padding:20px;margin-bottom:20px;">
        <div style="font-size:13px;color:#b85c00;font-weight:600;margin-bottom:8px;">📝 Câu hỏi kiến thức</div>
        ${sc.quiz.image ? `<img src="images/${sc.quiz.image}" style="width:100%;height:160px;object-fit:cover;border-radius:8px;margin-bottom:12px;">` : ''}
        <p style="font-size:16px;font-weight:600;color:#2c1b12;margin-bottom:12px;">${sc.quiz.question}</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${sc.quiz.options.map((opt,i) => `
            <button onclick="answerQuiz(this,${i},${sc.quiz.correct},'gs-${sc.id}')"
              style="padding:10px 16px;background:white;border:1.5px solid #ddd;border-radius:8px;font-size:15px;cursor:pointer;text-align:left;transition:0.2s;">
              ${String.fromCharCode(65+i)}. ${opt}
            </button>`).join('')}
        </div>
        <div id="quiz-result-${sc.id}" style="margin-top:12px;font-size:14px;display:none;"></div>
      </div>`;
    }

    if (sc.text) sc.text.forEach(t => html += `<p class="game-text">${t}</p>`);
    if (sc.dialogue) html += `<div class="game-dialogue">${sc.dialogue}</div>`;

    // OUTCOME với giải thích chi tiết
    if (sc.outcome) {
      html += `<div class="game-outcome ${sc.outcome.type}">
        ${sc.outcome.image ? `<img src="images/${sc.outcome.image}" style="width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:10px;">` : ''}
        ${sc.outcome.text}
        ${sc.outcome.detailed ? sc.outcome.detailed : ''}
      </div>`;
    }

    // CHOICES với ảnh + giải thích
    if (sc.choices) {
      html += `<div class="game-choices">`;
      sc.choices.forEach((c,i) => {
        html += `<button class="game-choice" onclick="gameChoose('${c.next}',${c.points||10})">
          ${c.image ? `<img src="images/${c.image}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0;">` : ''}
          <div style="flex:1;">
            <div style="display:flex;gap:8px;align-items:flex-start;">
              <span class="game-choice-letter">${String.fromCharCode(65+i)}</span>
              <span>${c.label}</span>
            </div>
            ${c.explanation ? `<div style="font-size:13px;color:#888;margin-top:6px;font-style:italic;">${c.explanation}</div>` : ''}
          </div>
        </button>`;
      });
      html += `</div>`;
    }

    if (sc.next) html += `<button class="game-continue" onclick="gameChoose('${sc.next}',0)">Tiếp tục →</button>`;

    // KẾT THÚC với badge
    if (sc.isEnd) {
      html += `<div class="game-result">
        <h3>${sc.endTitle||''}</h3>
        <p>${sc.endDesc||''}</p>
        <div id="final-badge" style="font-size:22px;margin:12px 0;"></div>
        <div id="final-points" style="font-size:18px;font-weight:700;color:#8B0000;margin-bottom:16px;"></div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="game-restart" onclick="gameRestart()">🔄 Chơi lại</button>
          <button class="game-restart" style="background:#f4c542;border-color:#f4c542;color:#2c1b12;" onclick="openLeaderboard()">🏆 Xem bảng xếp hạng</button>
          <button class="game-restart" style="background:#8B0000;color:white;" onclick="shareResult('${sc.endTitle||''}')">📤 Chia sẻ thành tích</button>
          <button class="game-restart" style="background:#1a5c8b;border-color:#1a5c8b;color:white;" onclick="claimBadge(getStoryId())">🏅 Nhận huy hiệu NFT</button>
        </div>
      </div>`;
    }

    html += `</div>`;
  });
  return html + '</div>';
}
function copyQuote(btn, quoteId) {
  const el = document.getElementById(quoteId);
  const textEl = el.querySelector('.quote-text-content');
  const citeEl = el.querySelector('cite');
  const text = textEl ? textEl.textContent.trim() : '';
  const citeText = citeEl ? citeEl.textContent.trim() : '';
  const fullText = citeText ? `${text}\n${citeText}` : text;

  navigator.clipboard.writeText(fullText).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '📋';
    }, 1800);
  }).catch(() => {
    alert('Không thể sao chép. Vui lòng thử lại.');
  });
}
function answerMiniQuiz(btn, chosen, correct, quizId) {
  const container = btn.parentElement;
  const resultEl = document.getElementById('mq-result-' + quizId);
  container.querySelectorAll('button').forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.style.background = '#d4edda'; btn.style.borderColor = '#28a745';
    resultEl.innerHTML = '✅ Chính xác!';
    resultEl.style.color = '#28a745';
  } else {
    btn.style.background = '#f8d7da'; btn.style.borderColor = '#dc3545';
    container.querySelectorAll('button')[correct].style.background = '#d4edda';
    container.querySelectorAll('button')[correct].style.borderColor = '#28a745';
    resultEl.innerHTML = '❌ Chưa đúng — đáp án đúng được tô xanh.';
    resultEl.style.color = '#dc3545';
  }
  resultEl.style.display = 'block';
}
function answerQuiz(btn, chosen, correct, sceneId) {
  const container = btn.parentElement;
  const resultEl = document.getElementById('quiz-result-' + sceneId.replace('gs-',''));
  container.querySelectorAll('button').forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.style.background = '#d4edda'; btn.style.borderColor = '#28a745';
    gamePoints += 10;
    resultEl.innerHTML = '✅ Đúng rồi! +10 điểm';
    resultEl.style.color = '#28a745';
  } else {
    btn.style.background = '#f8d7da'; btn.style.borderColor = '#dc3545';
    container.querySelectorAll('button')[correct].style.background = '#d4edda';
    container.querySelectorAll('button')[correct].style.borderColor = '#28a745';
    resultEl.innerHTML = '❌ Sai rồi! Đáp án đúng được tô xanh.';
    resultEl.style.color = '#dc3545';
  }
  resultEl.style.display = 'block';
  updateScoreDisplay();
}

function gameChoose(sceneId, pts) {
  gamePoints += (pts || 10);
  updateScoreDisplay();
  document.querySelectorAll('.game-scene').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('gs-' + sceneId);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({behavior:'smooth', block:'start'});
    // Nếu là màn kết thúc
    const finalBadge = el.querySelector('#final-badge');
    if (finalBadge) {
      if (gamePoints >= 60) { gameBadge = '🏛️ Chiến Lược Gia'; }
      else if (gamePoints >= 35) { gameBadge = '⚔️ Tướng Quân'; }
      else { gameBadge = '📚 Học Viên'; }
      finalBadge.textContent = gameBadge;
      el.querySelector('#final-points').textContent = `Tổng điểm: ${gamePoints} điểm`;
      awardExp(gamePoints, document.title);
    }
  }
}

function updateScoreDisplay() {
  const el = document.getElementById('game-score-display');
  const badgeEl = document.getElementById('game-badge-display');
  if (el) el.textContent = gamePoints;

  let rank = '📚 Học Viên';
  if (gamePoints >= 60) rank = '🏛️ Chiến Lược Gia';
  else if (gamePoints >= 35) rank = '⚔️ Tướng Quân';

  if (badgeEl) badgeEl.textContent = rank;

  // Điểm nổi ngoài giao diện chính
  let fsb = document.getElementById('floating-score-badge');
  if (!fsb) {
    fsb = document.createElement('div');
    fsb.id = 'floating-score-badge';
    fsb.innerHTML = `<span class="fsb-icon">🏆</span>
      <div>
        <div id="fsb-points">0 điểm</div>
        <div class="fsb-badge-text" id="fsb-rank">📚 Học Viên</div>
      </div>`;
    document.body.appendChild(fsb);
  }
  fsb.classList.add('show');
  document.getElementById('fsb-points').textContent = gamePoints + ' điểm';
  document.getElementById('fsb-rank').textContent = rank;
}

function shareResult(title) {
  const text = `Tôi vừa đạt ${gamePoints} điểm - ${gameBadge} trong "${title}" trên Sử Việt! Thử sức bạn xem sao 🎉`;
  if (navigator.share) {
    navigator.share({ title: 'Sử Việt', text: text, url: window.location.href }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text + ' ' + window.location.href)
      .then(() => alert('Đã sao chép kết quả! Dán vào Facebook/Zalo để chia sẻ nhé.'))
      .catch(() => alert(text));
  }
}
function gameRestart() {
  gamePoints = 0; gameBadge = '';
  updateScoreDisplay();
  document.querySelectorAll('.game-scene').forEach(s => s.classList.remove('active'));
  const first = document.querySelector('.game-scene');
  if (first) { first.classList.add('active'); first.scrollIntoView({behavior:'smooth'}); }
}

function renderTimeline(id) {
  const data = timelineData[id];
  if (!data) return;
  const container = document.createElement('div');
  container.style.cssText = `max-width:820px; margin:0 auto 40px; padding:0 20px;`;
  container.innerHTML = `
    <div style="background:#fff8e7;border:1px solid #f4c54260;border-radius:16px;padding:24px 28px;">
      <div style="font-size:13px;color:#b85c00;font-weight:600;letter-spacing:2px;margin-bottom:12px;">⏰ TIMELINE SỰ KIỆN</div>
      <div class="timeline-legend">
        <span><span class="dot" style="background:#8B0000;"></span>Bước ngoặt lớn</span>
        <span><span class="dot" style="background:#f4c542;"></span>Sự kiện quan trọng</span>
      </div>
      <div style="position:relative;">
        <div style="position:absolute;left:98px;top:0;bottom:0;width:2px;background:#f4c54260;"></div>
        ${data.map(item => `
          <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;">
            <div style="width:90px;min-width:90px;max-width:90px;text-align:right;font-size:12px;font-weight:600;color:#8B0000;padding-top:3px;white-space:normal;word-break:break-word;line-height:1.4;">${item.year}</div>
            <div class="tl-dot" style="width:12px;height:12px;min-width:12px;border-radius:50%;
              background:${item.highlight ? '#8B0000' : '#f4c542'};
              border:2px solid ${item.highlight ? '#8B0000' : '#c9a000'};
              margin-top:4px;transition:transform 0.2s;position:relative;z-index:1;"></div>
            <div style="font-size:15px;color:${item.highlight ? '#8B0000' : '#444'};
              font-weight:${item.highlight ? '600' : '400'};padding-top:1px;">${item.event}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  const leadText = document.querySelector('.lead-text');
  if (leadText) leadText.parentNode.insertBefore(container, leadText);
}

<script>
const BADGE_ADDRESS = "0x04Ac64b0723d30aEf76B10d3094937BE67c5021D";
const BADGE_ABI = ["function claimBadge(uint256 id)"];
const FUJI_PARAMS = {
  chainId: "0xA869",
  chainName: "Avalanche Fuji Testnet",
  nativeCurrency: { name: "AVAX", symbol: "AVAX", decimals: 18 },
  rpcUrls: ["https://api.avax-test.network/ext/bc/C/rpc"],
  blockExplorerUrls: ["https://testnet.snowtrace.io"]
};

async function claimBadge(storyId) {
  if (!window.ethereum) { alert("Vui lòng cài ví Core"); return; }
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    try {
      await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: FUJI_PARAMS.chainId }] });
    } catch (e) {
      await window.ethereum.request({ method: "wallet_addEthereumChain", params: [FUJI_PARAMS] });
    }
    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    const contract = new ethers.Contract(BADGE_ADDRESS, BADGE_ABI, signer);
    const tx = await contract.claimBadge(storyId);
    alert("Đang xác nhận giao dịch, vui lòng đợi vài giây...");
    await tx.wait();
    alert("Đã nhận huy hiệu NFT! Xem giao dịch: https://testnet.snowtrace.io/tx/" + tx.hash);
  } catch (e) {
    const msg = (e.shortMessage || e.message || "");
    alert(msg.includes("Already owned") ? "Bạn đã nhận huy hiệu này rồi." : "Lỗi: " + msg);
  }
}
</script>
